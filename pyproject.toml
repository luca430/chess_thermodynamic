[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thermo-chess"
version = "0.1.0"
description = "Thermodynamic/statistical-mechanics experiments for chess move selection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-chess>=1.999",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
thermo-view-match = "thermo_chess.live_viewer:main"

[tool.setuptools.packages.find]
where = ["src"]
